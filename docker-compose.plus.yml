# MailFlow Plus, offline/self-owned images. Requires Docker Compose >= 2.24.4.
# Load the prepared archive first, and set BOTH immutable image references in .env.
# docker compose -f docker-compose.plus.yml --env-file .env up -d --no-build --pull never
# This entry point does not use the upstream GHCR images or a latest fallback.
services:
  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    container_name: !reset null
    build: !reset null
    image: ${MAILFLOW_FRONTEND_IMAGE:?Set the prepared Plus frontend tag or registry@sha256 digest}
    ports: !override
      - "${APP_PORT:-127.0.0.1:8443}:443"
      - "${APP_HTTP_PORT:-127.0.0.1:8080}:80"

  backend:
    extends:
      file: docker-compose.yml
      service: backend
    container_name: !reset null
    build: !reset null
    image: ${MAILFLOW_BACKEND_IMAGE:?Set the prepared Plus backend tag or registry@sha256 digest}
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set the persistent ENCRYPTION_KEY}

  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    container_name: !reset null
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    container_name: !reset null

  caddy:
    extends:
      file: docker-compose.yml
      service: caddy
    container_name: !reset null

volumes:
  postgres_data:
  redis_data:
  image_cache:
  caddy_data:
  caddy_config:

networks:
  mailflow:
    driver: bridge

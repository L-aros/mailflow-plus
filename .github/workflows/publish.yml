name: Publish to GHCR

# Kept disabled in repository settings. No tag-triggered publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-not-configured:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '::error::Registry publishing is not configured. Use CI to prepare the exact Plus commit; review release-manifest.json and choose registry ownership/visibility before implementing promotion.'
          exit 1

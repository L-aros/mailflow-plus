name: CI

on:
  push:
    branches: ["main", "mailflow-plus"]
  pull_request:
    branches: ["main", "mailflow-plus"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Tests and image preparation use the same source, including on PRs.
  VERIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # For the *.postgres.test.js suites, which are skipped without MAILFLOW_TEST_DATABASE_URL. They
    # create and drop their own databases, so the service needs no setup.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mailflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Plugin boundary
        working-directory: backend
        run: npm run lint:plugins

      - name: Syntax check
        working-directory: backend
        run: node --check src/index.js

      - name: Test
        working-directory: backend
        env:
          MAILFLOW_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mailflow_test
        run: npm test

      - name: Audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  prepare:
    name: Plus images and recovery drill
    needs: [backend, frontend]
    if: github.ref_name == 'mailflow-plus' || github.base_ref == 'mailflow-plus' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Install backup encryption tool
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Prepare offline images and exercise recovery
        env:
          PREPARE_OUTPUT: ${{ runner.temp }}/mailflow-release
        run: bash scripts/release/prepare.sh
      - name: Upload verified offline candidate
        uses: actions/upload-artifact@v4
        with:
          name: mailflow-plus-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/mailflow-release
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-diagnostics-${{ env.VERIFIED_SHA }}
          path: ${{ runner.temp }}/mailflow-release/validation
          if-no-files-found: ignore
          retention-days: 14
